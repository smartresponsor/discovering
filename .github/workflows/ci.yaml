name: discovering-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovering-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: json, pdo, pdo_sqlite, dom, mbstring, xml, xmlwriter

      - name: Environment preflight
        run: php tools/runtime_preflight.php --test-runtime

      - name: Validate composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Post-install runtime preflight
        run: php tools/runtime_preflight.php --require-vendor --test-runtime

      - name: Console boot smoke
        run: php bin/console list --raw

      - name: Verify docblock policy
        run: composer verify:docblocks

      - name: Verify security baseline
        run: composer verify:security

      - name: Lint PHP sources
        run: composer lint:php

      - name: Run static analysis
        run: composer analyse

      - name: Run unit tests
        run: composer test:unit

      - name: Run contract tests
        run: composer test:contract

      - name: Run behavioral tests
        run: composer test:behavioral

      - name: Run functional tests
        run: composer test:functional
