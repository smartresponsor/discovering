parameters:
  app.discovery.default_sqlite_path: '%kernel.project_dir%/var/discovery/discovering.sqlite'
  app.discovery.default_feedback_path: '%kernel.project_dir%/var/discovery/discovering-feedback.sqlite'
  app.discovery.default_feedback_backend: 'sqlite_path'
  app.discovery.default_feedback_pdo_dsn: ''
  app.discovery.default_feedback_pdo_user: ''
  app.discovery.default_feedback_pdo_password: ''
  app.discovery.default_feedback_pdo_table: 'discovery_feedback'
  app.discovery.default_operation_log_path: '%kernel.project_dir%/var/discovery/discovery_operation_event_log.json'
  app.discovery.default_operation_log_backend: 'file'
  app.discovery.default_operation_log_pdo_dsn: ''
  app.discovery.default_operation_log_pdo_user: ''
  app.discovery.default_operation_log_pdo_password: ''
  app.discovery.default_operation_log_pdo_table: 'discovery_operation_event_log'
  app.discovery.default_rebuild_evidence_path: '%kernel.project_dir%/var/discovery/discovery_rebuild_evidence.json'
  app.discovery.default_rebuild_evidence_backend: 'file'
  app.discovery.default_rebuild_evidence_pdo_dsn: ''
  app.discovery.default_rebuild_evidence_pdo_user: ''
  app.discovery.default_rebuild_evidence_pdo_password: ''
  app.discovery.default_rebuild_evidence_pdo_table: 'discovery_rebuild_evidence'
  app.discovery.default_libsource_event_log_path: '%kernel.project_dir%/var/discovery/libsource_operator_event_log.json'
  app.discovery.default_libsource_event_log_backend: 'file'
  app.discovery.default_libsource_event_log_pdo_dsn: ''
  app.discovery.default_libsource_event_log_pdo_user: ''
  app.discovery.default_libsource_event_log_pdo_password: ''
  app.discovery.default_libsource_event_log_pdo_table: 'discovery_libsource_operator_event_log'
  app.discovery.default_rate_limit_store_path: '%kernel.project_dir%/var/discovery/discovery_rate_limit_store.json'
  app.discovery.default_rate_limit_backend: 'file'
  app.discovery.default_rate_limit_pdo_dsn: ''
  app.discovery.default_rate_limit_pdo_user: ''
  app.discovery.default_rate_limit_pdo_password: ''
  app.discovery.default_rate_limit_pdo_table: 'discovery_rate_limit_bucket'
  app.discovery.default_query_rate_limit: 60
  app.discovery.default_query_rate_limit_window_seconds: 60
  app.discovery.default_write_rate_limit: 20
  app.discovery.default_write_rate_limit_window_seconds: 60
  app.discovery.default_management_mutation_rate_limit: 10
  app.discovery.default_management_mutation_rate_limit_window_seconds: 300

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'

  App\Controller\:
    resource: '../src/Controller/'
    tags: ['controller.service_arguments']

  App\Service\Discovery\Source\ProjectDiscoverySourceProvider:
    tags: ['app.discovery_source_provider']

  App\Service\Discovery\Source\OfferingDiscoverySourceProvider:
    tags: ['app.discovery_source_provider']

  App\Service\Discovery\Source\DocumentDiscoverySourceProvider:
    tags: ['app.discovery_source_provider']

  App\Service\Discovery\Source\CategoryDiscoverySourceProvider:
    tags: ['app.discovery_source_provider']

  App\Service\Discovery\Source\PlaybookDiscoverySourceProvider:
    tags: ['app.discovery_source_provider']

  App\Service\Discovery\Source\BriefingDiscoverySourceProvider:
    tags: ['app.discovery_source_provider']

  App\Service\Discovery\Source\Repository\ProjectDiscoverySourceRecordRepository:
    tags: ['app.discovery_source_repository']

  App\Service\Discovery\Source\Repository\OfferingDiscoverySourceRecordRepository:
    tags: ['app.discovery_source_repository']

  App\Service\Discovery\Source\Repository\DocumentDiscoverySourceRecordRepository:
    tags: ['app.discovery_source_repository']

  App\Service\Discovery\Source\Repository\CategoryDiscoverySourceRecordRepository:
    tags: ['app.discovery_source_repository']

  App\Service\Discovery\Source\Repository\PlaybookFileDiscoverySourceRecordRepository:
    tags: ['app.discovery_source_repository']
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Service\Discovery\Source\Repository\BriefingFileDiscoverySourceRecordRepository:
    tags: ['app.discovery_source_repository']
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\ServiceInterface\Discovery\Adapter\DiscoveryAdapterInterface: '@App\Service\Discovery\Adapter\SqliteFtsDiscoveryAdapter'
  App\ServiceInterface\Discovery\Indexer\DiscoveryIndexerInterface: '@App\Service\Discovery\Indexer\DiscoveryIndexer'
  App\ServiceInterface\Discovery\DiscoveryServiceInterface: '@App\Service\Discovery\DiscoveryService'
  App\ServiceInterface\Discovery\Document\DiscoveryDocumentProviderInterface: '@App\Service\Discovery\Document\DiscoveryDocumentProvider'
  App\ServiceInterface\Discovery\Overview\DiscoveryOverviewServiceInterface: '@App\Service\Discovery\Overview\DiscoveryOverviewService'
  App\Service\Discovery\Libsource\Log\LibsourceOperatorEventLogStoreInterface: '@App\Service\Discovery\Libsource\Log\ConfigurableLibsourceOperatorEventLogStore'
  App\Service\Discovery\Operations\DiscoveryOperationEventLogStoreInterface: '@App\Service\Discovery\Operations\ConfigurableDiscoveryOperationEventLogStore'
  App\Service\Discovery\Rebuild\DiscoveryRebuildEvidenceStoreInterface: '@App\Service\Discovery\Rebuild\ConfigurableDiscoveryRebuildEvidenceStore'

  App\Service\Discovery\Document\DiscoveryDocumentProvider:
    arguments:
      $sourceProviders: !tagged_iterator app.discovery_source_provider

  App\Service\Discovery\Overview\DiscoveryOverviewService:
    arguments:
      $sourceProviders: !tagged_iterator app.discovery_source_provider

  App\Service\Discovery\Libsource\LibsourceDiagnosticSurfaceBuilder:
    arguments:
      $sourceProviders: !tagged_iterator app.discovery_source_provider

  App\Service\Discovery\Source\Repository\DiscoverySourceRepositoryRegistry:
    arguments:
      $repositories: !tagged_iterator app.discovery_source_repository

  App\Service\Discovery\Topology\DiscoveryStateTopologyBuilder:
    arguments:
      $projectDir: '%kernel.project_dir%'
      $discoverySqlitePath: '%env(default:app.discovery.default_sqlite_path:APP_DISCOVERY_SQLITE_PATH)%'
      $feedbackPath: '%env(default:app.discovery.default_feedback_path:APP_DISCOVERY_FEEDBACK_SQLITE_PATH)%'
      $feedbackBackend: '%env(default:app.discovery.default_feedback_backend:APP_DISCOVERY_FEEDBACK_BACKEND)%'
      $feedbackPdoDsn: '%env(default:app.discovery.default_feedback_pdo_dsn:APP_DISCOVERY_FEEDBACK_PDO_DSN)%'
      $feedbackPdoTable: '%env(default:app.discovery.default_feedback_pdo_table:APP_DISCOVERY_FEEDBACK_PDO_TABLE)%'
      $operationLogPath: '%env(default:app.discovery.default_operation_log_path:APP_DISCOVERY_OPERATION_LOG_PATH)%'
      $operationLogBackend: '%env(default:app.discovery.default_operation_log_backend:APP_DISCOVERY_OPERATION_LOG_BACKEND)%'
      $operationLogPdoDsn: '%env(default:app.discovery.default_operation_log_pdo_dsn:APP_DISCOVERY_OPERATION_LOG_PDO_DSN)%'
      $operationLogPdoTable: '%env(default:app.discovery.default_operation_log_pdo_table:APP_DISCOVERY_OPERATION_LOG_PDO_TABLE)%'
      $rebuildEvidencePath: '%env(default:app.discovery.default_rebuild_evidence_path:APP_DISCOVERY_REBUILD_EVIDENCE_PATH)%'
      $rebuildEvidenceBackend: '%env(default:app.discovery.default_rebuild_evidence_backend:APP_DISCOVERY_REBUILD_EVIDENCE_BACKEND)%'
      $rebuildEvidencePdoDsn: '%env(default:app.discovery.default_rebuild_evidence_pdo_dsn:APP_DISCOVERY_REBUILD_EVIDENCE_PDO_DSN)%'
      $rebuildEvidencePdoTable: '%env(default:app.discovery.default_rebuild_evidence_pdo_table:APP_DISCOVERY_REBUILD_EVIDENCE_PDO_TABLE)%'
      $libsourceEventLogPath: '%env(default:app.discovery.default_libsource_event_log_path:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_PATH)%'
      $libsourceEventLogBackend: '%env(default:app.discovery.default_libsource_event_log_backend:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_BACKEND)%'
      $libsourceEventLogPdoDsn: '%env(default:app.discovery.default_libsource_event_log_pdo_dsn:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_PDO_DSN)%'
      $libsourceEventLogPdoTable: '%env(default:app.discovery.default_libsource_event_log_pdo_table:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_PDO_TABLE)%'
      $rateLimitBackend: '%env(default:app.discovery.default_rate_limit_backend:APP_DISCOVERY_RATE_LIMIT_BACKEND)%'
      $rateLimitStorePath: '%env(default:app.discovery.default_rate_limit_store_path:APP_DISCOVERY_RATE_LIMIT_STORE_PATH)%'
      $rateLimitPdoDsn: '%env(default:app.discovery.default_rate_limit_pdo_dsn:APP_DISCOVERY_RATE_LIMIT_PDO_DSN)%'
      $rateLimitPdoTable: '%env(default:app.discovery.default_rate_limit_pdo_table:APP_DISCOVERY_RATE_LIMIT_PDO_TABLE)%'

  App\Service\Discovery\Libsource\Log\FileLibsourceOperatorEventLogStore:
    arguments:
      $path: '%env(default:app.discovery.default_libsource_event_log_path:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_PATH)%'

  App\Service\Discovery\Libsource\Log\PdoLibsourceOperatorEventLogStore:
    arguments:
      $dsn: '%env(default:app.discovery.default_libsource_event_log_pdo_dsn:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_PDO_DSN)%'
      $user: '%env(default:app.discovery.default_libsource_event_log_pdo_user:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_PDO_USER)%'
      $password: '%env(default:app.discovery.default_libsource_event_log_pdo_password:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_PDO_PASSWORD)%'
      $tableName: '%env(default:app.discovery.default_libsource_event_log_pdo_table:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_PDO_TABLE)%'

  App\Service\Discovery\Libsource\Log\ConfigurableLibsourceOperatorEventLogStore:
    arguments:
      $backend: '%env(default:app.discovery.default_libsource_event_log_backend:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_BACKEND)%'
      $pdoDsn: '%env(default:app.discovery.default_libsource_event_log_pdo_dsn:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_PDO_DSN)%'

  App\Service\Discovery\Operations\FileDiscoveryOperationEventLogStore:
    arguments:
      $path: '%env(default:app.discovery.default_operation_log_path:APP_DISCOVERY_OPERATION_LOG_PATH)%'

  App\Service\Discovery\Operations\PdoDiscoveryOperationEventLogStore:
    arguments:
      $dsn: '%env(default:app.discovery.default_operation_log_pdo_dsn:APP_DISCOVERY_OPERATION_LOG_PDO_DSN)%'
      $user: '%env(default:app.discovery.default_operation_log_pdo_user:APP_DISCOVERY_OPERATION_LOG_PDO_USER)%'
      $password: '%env(default:app.discovery.default_operation_log_pdo_password:APP_DISCOVERY_OPERATION_LOG_PDO_PASSWORD)%'
      $tableName: '%env(default:app.discovery.default_operation_log_pdo_table:APP_DISCOVERY_OPERATION_LOG_PDO_TABLE)%'

  App\Service\Discovery\Operations\ConfigurableDiscoveryOperationEventLogStore:
    arguments:
      $backend: '%env(default:app.discovery.default_operation_log_backend:APP_DISCOVERY_OPERATION_LOG_BACKEND)%'
      $pdoDsn: '%env(default:app.discovery.default_operation_log_pdo_dsn:APP_DISCOVERY_OPERATION_LOG_PDO_DSN)%'

  App\Service\Discovery\Rebuild\FileDiscoveryRebuildEvidenceStore:
    arguments:
      $path: '%env(default:app.discovery.default_rebuild_evidence_path:APP_DISCOVERY_REBUILD_EVIDENCE_PATH)%'

  App\Service\Discovery\Rebuild\PdoDiscoveryRebuildEvidenceStore:
    arguments:
      $dsn: '%env(default:app.discovery.default_rebuild_evidence_pdo_dsn:APP_DISCOVERY_REBUILD_EVIDENCE_PDO_DSN)%'
      $user: '%env(default:app.discovery.default_rebuild_evidence_pdo_user:APP_DISCOVERY_REBUILD_EVIDENCE_PDO_USER)%'
      $password: '%env(default:app.discovery.default_rebuild_evidence_pdo_password:APP_DISCOVERY_REBUILD_EVIDENCE_PDO_PASSWORD)%'
      $tableName: '%env(default:app.discovery.default_rebuild_evidence_pdo_table:APP_DISCOVERY_REBUILD_EVIDENCE_PDO_TABLE)%'

  App\Service\Discovery\Rebuild\ConfigurableDiscoveryRebuildEvidenceStore:
    arguments:
      $backend: '%env(default:app.discovery.default_rebuild_evidence_backend:APP_DISCOVERY_REBUILD_EVIDENCE_BACKEND)%'
      $pdoDsn: '%env(default:app.discovery.default_rebuild_evidence_pdo_dsn:APP_DISCOVERY_REBUILD_EVIDENCE_PDO_DSN)%'

  App\Service\Discovery\RateLimit\DiscoveryRateLimitStoreInterface: '@App\Service\Discovery\RateLimit\ConfigurableDiscoveryRateLimitStore'

  App\Service\Discovery\RateLimit\FileDiscoveryRateLimitStore:
    arguments:
      $path: '%env(default:app.discovery.default_rate_limit_store_path:APP_DISCOVERY_RATE_LIMIT_STORE_PATH)%'

  App\Service\Discovery\RateLimit\PdoDiscoveryRateLimitStore:
    arguments:
      $dsn: '%env(default:app.discovery.default_rate_limit_pdo_dsn:APP_DISCOVERY_RATE_LIMIT_PDO_DSN)%'
      $user: '%env(default:app.discovery.default_rate_limit_pdo_user:APP_DISCOVERY_RATE_LIMIT_PDO_USER)%'
      $password: '%env(default:app.discovery.default_rate_limit_pdo_password:APP_DISCOVERY_RATE_LIMIT_PDO_PASSWORD)%'
      $tableName: '%env(default:app.discovery.default_rate_limit_pdo_table:APP_DISCOVERY_RATE_LIMIT_PDO_TABLE)%'

  App\Service\Discovery\RateLimit\ConfigurableDiscoveryRateLimitStore:
    arguments:
      $backend: '%env(default:app.discovery.default_rate_limit_backend:APP_DISCOVERY_RATE_LIMIT_BACKEND)%'

  App\Service\Discovery\RateLimit\DiscoveryRateLimiter:
    arguments:
      $queryLimit: '%env(int:default:app.discovery.default_query_rate_limit:APP_DISCOVERY_QUERY_RATE_LIMIT)%'
      $queryWindowSeconds: '%env(int:default:app.discovery.default_query_rate_limit_window_seconds:APP_DISCOVERY_QUERY_RATE_LIMIT_WINDOW_SECONDS)%'
      $writeLimit: '%env(int:default:app.discovery.default_write_rate_limit:APP_DISCOVERY_WRITE_RATE_LIMIT)%'
      $writeWindowSeconds: '%env(int:default:app.discovery.default_write_rate_limit_window_seconds:APP_DISCOVERY_WRITE_RATE_LIMIT_WINDOW_SECONDS)%'
      $managementMutationLimit: '%env(int:default:app.discovery.default_management_mutation_rate_limit:APP_DISCOVERY_MANAGEMENT_MUTATION_RATE_LIMIT)%'
      $managementMutationWindowSeconds: '%env(int:default:app.discovery.default_management_mutation_rate_limit_window_seconds:APP_DISCOVERY_MANAGEMENT_MUTATION_RATE_LIMIT_WINDOW_SECONDS)%'

  App\Service\Discovery\Adapter\SqliteFtsDiscoveryAdapter:
    arguments:
      $path: '%env(default:app.discovery.default_sqlite_path:APP_DISCOVERY_SQLITE_PATH)%'

  App\Service\Discovery\DiscoveryFeedbackStoreInterface: '@App\Service\Discovery\ConfigurableDiscoveryFeedbackStore'

  App\Service\Discovery\DiscoveryFeedbackStore:
    arguments:
      $path: '%env(default:app.discovery.default_feedback_path:APP_DISCOVERY_FEEDBACK_SQLITE_PATH)%'

  App\Service\Discovery\PdoDiscoveryFeedbackStore:
    arguments:
      $dsn: '%env(default:app.discovery.default_feedback_pdo_dsn:APP_DISCOVERY_FEEDBACK_PDO_DSN)%'
      $user: '%env(default:app.discovery.default_feedback_pdo_user:APP_DISCOVERY_FEEDBACK_PDO_USER)%'
      $password: '%env(default:app.discovery.default_feedback_pdo_password:APP_DISCOVERY_FEEDBACK_PDO_PASSWORD)%'
      $tableName: '%env(default:app.discovery.default_feedback_pdo_table:APP_DISCOVERY_FEEDBACK_PDO_TABLE)%'

  App\Service\Discovery\ConfigurableDiscoveryFeedbackStore:
    arguments:
      $backend: '%env(default:app.discovery.default_feedback_backend:APP_DISCOVERY_FEEDBACK_BACKEND)%'
      $pdoDsn: '%env(default:app.discovery.default_feedback_pdo_dsn:APP_DISCOVERY_FEEDBACK_PDO_DSN)%'

  App\EventSubscriber\DiscoveryEndpointSecuritySubscriber:
    arguments:
      $managementToken: '%env(APP_DISCOVERY_MANAGEMENT_TOKEN)%'
      $apiWriteToken: '%env(APP_DISCOVERY_API_WRITE_TOKEN)%'
