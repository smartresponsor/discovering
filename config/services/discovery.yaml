parameters:
  app.discovery.default_sqlite_path: '%kernel.project_dir%/var/discovery/discovering.sqlite'
  app.discovery.default_index_backend: 'sqlite'
  app.discovery.default_meili_url: ''
  app.discovery.default_meili_api_key: ''
  app.discovery.default_meili_index_prefix: 'discovering'
  app.discovery.default_feedback_backend: 'doctrine'
  app.discovery.default_operation_log_path: '%kernel.project_dir%/var/discovery/discovery_operation_event_log.json'
  app.discovery.default_operation_log_backend: 'doctrine'
  app.discovery.default_rebuild_evidence_path: '%kernel.project_dir%/var/discovery/discovery_rebuild_evidence.json'
  app.discovery.default_rebuild_evidence_backend: 'doctrine'
  app.discovery.default_libsource_event_log_path: '%kernel.project_dir%/var/discovery/libsource_operator_event_log.json'
  app.discovery.default_libsource_event_log_backend: 'doctrine'
  app.discovery.default_rate_limit_store_path: '%kernel.project_dir%/var/discovery/discovery_rate_limit_store.json'
  app.discovery.default_rate_limit_backend: 'doctrine'
  app.discovery.default_query_rate_limit: 60
  app.discovery.default_query_rate_limit_window_seconds: 60
  app.discovery.default_write_rate_limit: 20
  app.discovery.default_write_rate_limit_window_seconds: 60
  app.discovery.default_management_mutation_rate_limit: 10
  app.discovery.default_management_mutation_rate_limit_window_seconds: 300

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\Discovering\Service\Discovery\Source\ProjectDiscoverySourceProvider:
    tags: ['app.discovery_source_provider']

  App\Discovering\Service\Discovery\Source\OfferingDiscoverySourceProvider:
    tags: ['app.discovery_source_provider']

  App\Discovering\Service\Discovery\Source\DocumentDiscoverySourceProvider:
    tags: ['app.discovery_source_provider']

  App\Discovering\Service\Discovery\Source\CategoryDiscoverySourceProvider:
    tags: ['app.discovery_source_provider']

  App\Discovering\Service\Discovery\Source\PlaybookDiscoverySourceProvider:
    tags: ['app.discovery_source_provider']

  App\Discovering\Service\Discovery\Source\BriefingDiscoverySourceProvider:
    tags: ['app.discovery_source_provider']

  App\Discovering\Service\Discovery\Source\Repository\ProjectDiscoverySourceRecordRepository:
    tags: ['app.discovery_source_repository']

  App\Discovering\Service\Discovery\Source\Repository\OfferingDiscoverySourceRecordRepository:
    tags: ['app.discovery_source_repository']

  App\Discovering\Service\Discovery\Source\Repository\DocumentDiscoverySourceRecordRepository:
    tags: ['app.discovery_source_repository']

  App\Discovering\Service\Discovery\Source\Repository\CategoryDiscoverySourceRecordRepository:
    tags: ['app.discovery_source_repository']

  App\Discovering\Service\Discovery\Source\Repository\PlaybookFileDiscoverySourceRecordRepository:
    tags: ['app.discovery_source_repository']
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Discovering\Service\Discovery\Source\Repository\BriefingFileDiscoverySourceRecordRepository:
    tags: ['app.discovery_source_repository']
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Discovering\ServiceInterface\Discovery\Backend\DiscoveryBackendInterface: '@App\Discovering\Service\Discovery\Backend\ConfigurableDiscoveryBackend'
  App\Discovering\ServiceInterface\Discovery\Indexer\DiscoveryIndexerInterface: '@App\Discovering\Service\Discovery\Indexer\DiscoveryIndexer'
  App\Discovering\ServiceInterface\Discovery\DiscoveryServiceInterface: '@App\Discovering\Service\Discovery\DiscoveryService'
  App\Discovering\ServiceInterface\Discovery\Document\DiscoveryDocumentProviderInterface: '@App\Discovering\Service\Discovery\Document\DiscoveryDocumentProvider'
  App\Discovering\ServiceInterface\Discovery\Overview\DiscoveryOverviewServiceInterface: '@App\Discovering\Service\Discovery\Overview\DiscoveryOverviewService'
  App\Discovering\ServiceInterface\Discovery\DiscoveryFeedbackStoreInterface: '@App\Discovering\Service\Discovery\ConfigurableDiscoveryFeedbackStore'
  App\Discovering\ServiceInterface\Discovery\Libsource\Log\LibsourceOperatorEventLogStoreInterface: '@App\Discovering\Service\Discovery\Libsource\Log\ConfigurableLibsourceOperatorEventLogStore'
  App\Discovering\ServiceInterface\Discovery\Operations\DiscoveryOperationEventLogStoreInterface: '@App\Discovering\Service\Discovery\Operations\ConfigurableDiscoveryOperationEventLogStore'
  App\Discovering\ServiceInterface\Discovery\Rebuild\DiscoveryRebuildEvidenceStoreInterface: '@App\Discovering\Service\Discovery\Rebuild\ConfigurableDiscoveryRebuildEvidenceStore'
  App\Discovering\ServiceInterface\Discovery\RateLimit\DiscoveryRateLimitStoreInterface: '@App\Discovering\Service\Discovery\RateLimit\ConfigurableDiscoveryRateLimitStore'
  App\Discovering\ServiceInterface\Discovery\Diagnostics\DiscoveryProbeTransportInterface: '@App\Discovering\Service\Discovery\Diagnostics\NetworkDiscoveryProbeTransport'

  App\Discovering\Service\Discovery\Document\DiscoveryDocumentProvider:
    arguments:
      $sourceProviders: !tagged_iterator app.discovery_source_provider

  App\Discovering\Service\Discovery\Overview\DiscoveryOverviewService:
    arguments:
      $sourceProviders: !tagged_iterator app.discovery_source_provider

  App\Discovering\Service\Discovery\Libsource\LibsourceDiagnosticSurfaceBuilder:
    arguments:
      $sourceProviders: !tagged_iterator app.discovery_source_provider

  App\Discovering\Service\Discovery\Source\Repository\DiscoverySourceRepositoryRegistry:
    arguments:
      $repositories: !tagged_iterator app.discovery_source_repository


  App\Discovering\Service\Discovery\Diagnostics\DiscoveryBackendReachabilityBuilder:
    arguments:
      $indexBackend: '%env(default:app.discovery.default_index_backend:APP_DISCOVERY_INDEX_BACKEND)%'
      $meiliUrl: '%env(default:app.discovery.default_meili_url:APP_DISCOVERY_MEILI_URL)%'
      $meiliApiKey: '%env(default:app.discovery.default_meili_api_key:APP_DISCOVERY_MEILI_API_KEY)%'
      $feedbackBackend: '%env(default:app.discovery.default_feedback_backend:APP_DISCOVERY_FEEDBACK_BACKEND)%'
      $operationLogBackend: '%env(default:app.discovery.default_operation_log_backend:APP_DISCOVERY_OPERATION_LOG_BACKEND)%'
      $rebuildEvidenceBackend: '%env(default:app.discovery.default_rebuild_evidence_backend:APP_DISCOVERY_REBUILD_EVIDENCE_BACKEND)%'
      $libsourceEventLogBackend: '%env(default:app.discovery.default_libsource_event_log_backend:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_BACKEND)%'
      $rateLimitBackend: '%env(default:app.discovery.default_rate_limit_backend:APP_DISCOVERY_RATE_LIMIT_BACKEND)%'

  App\Discovering\Service\Discovery\Topology\DiscoveryStateTopologyBuilder:
    arguments:
      $projectDir: '%kernel.project_dir%'
      $discoverySqlitePath: '%env(default:app.discovery.default_sqlite_path:APP_DISCOVERY_SQLITE_PATH)%'
      $indexBackend: '%env(default:app.discovery.default_index_backend:APP_DISCOVERY_INDEX_BACKEND)%'
      $meiliUrl: '%env(default:app.discovery.default_meili_url:APP_DISCOVERY_MEILI_URL)%'
      $meiliIndexPrefix: '%env(default:app.discovery.default_meili_index_prefix:APP_DISCOVERY_MEILI_INDEX_PREFIX)%'
      $operationLogPath: '%env(default:app.discovery.default_operation_log_path:APP_DISCOVERY_OPERATION_LOG_PATH)%'
      $operationLogBackend: '%env(default:app.discovery.default_operation_log_backend:APP_DISCOVERY_OPERATION_LOG_BACKEND)%'
      $rebuildEvidencePath: '%env(default:app.discovery.default_rebuild_evidence_path:APP_DISCOVERY_REBUILD_EVIDENCE_PATH)%'
      $rebuildEvidenceBackend: '%env(default:app.discovery.default_rebuild_evidence_backend:APP_DISCOVERY_REBUILD_EVIDENCE_BACKEND)%'
      $libsourceEventLogPath: '%env(default:app.discovery.default_libsource_event_log_path:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_PATH)%'
      $libsourceEventLogBackend: '%env(default:app.discovery.default_libsource_event_log_backend:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_BACKEND)%'
      $rateLimitBackend: '%env(default:app.discovery.default_rate_limit_backend:APP_DISCOVERY_RATE_LIMIT_BACKEND)%'
      $rateLimitStorePath: '%env(default:app.discovery.default_rate_limit_store_path:APP_DISCOVERY_RATE_LIMIT_STORE_PATH)%'

  App\Discovering\Service\Discovery\Libsource\Log\FileLibsourceOperatorEventLogStore:
    arguments:
      $path: '%env(default:app.discovery.default_libsource_event_log_path:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_PATH)%'

  App\Discovering\Service\Discovery\Libsource\Log\DoctrineLibsourceOperatorEventLogStore: ~

  App\Discovering\Service\Discovery\Libsource\Log\ConfigurableLibsourceOperatorEventLogStore:
    arguments:
      $backend: '%env(default:app.discovery.default_libsource_event_log_backend:APP_DISCOVERY_LIBSOURCE_EVENT_LOG_BACKEND)%'

  App\Discovering\Service\Discovery\Operations\FileDiscoveryOperationEventLogStore:
    arguments:
      $path: '%env(default:app.discovery.default_operation_log_path:APP_DISCOVERY_OPERATION_LOG_PATH)%'

  App\Discovering\Service\Discovery\Operations\DoctrineDiscoveryOperationEventLogStore: ~

  App\Discovering\Service\Discovery\Operations\ConfigurableDiscoveryOperationEventLogStore:
    arguments:
      $backend: '%env(default:app.discovery.default_operation_log_backend:APP_DISCOVERY_OPERATION_LOG_BACKEND)%'

  App\Discovering\Service\Discovery\Rebuild\FileDiscoveryRebuildEvidenceStore:
    arguments:
      $path: '%env(default:app.discovery.default_rebuild_evidence_path:APP_DISCOVERY_REBUILD_EVIDENCE_PATH)%'

  App\Discovering\Service\Discovery\Rebuild\DoctrineDiscoveryRebuildEvidenceStore: ~

  App\Discovering\Service\Discovery\Rebuild\ConfigurableDiscoveryRebuildEvidenceStore:
    arguments:
      $backend: '%env(default:app.discovery.default_rebuild_evidence_backend:APP_DISCOVERY_REBUILD_EVIDENCE_BACKEND)%'


  App\Discovering\Service\Discovery\RateLimit\FileDiscoveryRateLimitStore:
    arguments:
      $path: '%env(default:app.discovery.default_rate_limit_store_path:APP_DISCOVERY_RATE_LIMIT_STORE_PATH)%'

  App\Discovering\Service\Discovery\RateLimit\DoctrineDiscoveryRateLimitStore: ~

  App\Discovering\Service\Discovery\RateLimit\ConfigurableDiscoveryRateLimitStore:
    arguments:
      $backend: '%env(default:app.discovery.default_rate_limit_backend:APP_DISCOVERY_RATE_LIMIT_BACKEND)%'

  App\Discovering\Service\Discovery\RateLimit\DiscoveryRateLimiter:
    arguments:
      $queryLimit: '%env(int:default:app.discovery.default_query_rate_limit:APP_DISCOVERY_QUERY_RATE_LIMIT)%'
      $queryWindowSeconds: '%env(int:default:app.discovery.default_query_rate_limit_window_seconds:APP_DISCOVERY_QUERY_RATE_LIMIT_WINDOW_SECONDS)%'
      $writeLimit: '%env(int:default:app.discovery.default_write_rate_limit:APP_DISCOVERY_WRITE_RATE_LIMIT)%'
      $writeWindowSeconds: '%env(int:default:app.discovery.default_write_rate_limit_window_seconds:APP_DISCOVERY_WRITE_RATE_LIMIT_WINDOW_SECONDS)%'
      $managementMutationLimit: '%env(int:default:app.discovery.default_management_mutation_rate_limit:APP_DISCOVERY_MANAGEMENT_MUTATION_RATE_LIMIT)%'
      $managementMutationWindowSeconds: '%env(int:default:app.discovery.default_management_mutation_rate_limit_window_seconds:APP_DISCOVERY_MANAGEMENT_MUTATION_RATE_LIMIT_WINDOW_SECONDS)%'

  App\Discovering\Service\Discovery\Backend\ConfigurableDiscoveryBackend:
    arguments:
      $backend: '%env(default:app.discovery.default_index_backend:APP_DISCOVERY_INDEX_BACKEND)%'
      $meiliBase: '%env(default:app.discovery.default_meili_url:APP_DISCOVERY_MEILI_URL)%'

  App\Discovering\Service\Discovery\Backend\SqliteFtsDiscoveryBackend:
    arguments:
      $entityManager: '@doctrine.orm.entity_manager'

  App\Discovering\Service\Discovery\Backend\MeiliDiscoveryBackend:
    arguments:
      $base: '%env(default:app.discovery.default_meili_url:APP_DISCOVERY_MEILI_URL)%'
      $key: '%env(default:app.discovery.default_meili_api_key:APP_DISCOVERY_MEILI_API_KEY)%'
      $indexPrefix: '%env(default:app.discovery.default_meili_index_prefix:APP_DISCOVERY_MEILI_INDEX_PREFIX)%'

  App\Discovering\Service\Discovery\DoctrineDiscoveryFeedbackStore: ~

  App\Discovering\Service\Discovery\ConfigurableDiscoveryFeedbackStore: ~

  App\Discovering\Subscriber\Discovery\DiscoveryEndpointSecuritySubscriber:
    arguments:
      $requestSurfacePolicy: '@App\Discovering\Service\Discovery\Http\DiscoveryRequestSurfacePolicy'
      $managementToken: '%env(APP_DISCOVERY_MANAGEMENT_TOKEN)%'
      $apiWriteToken: '%env(APP_DISCOVERY_API_WRITE_TOKEN)%'
      $jsonResponseFactory: '@App\Discovering\Service\Discovery\Http\DiscoveryJsonResponseFactory'
