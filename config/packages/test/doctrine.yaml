doctrine:
  dbal:
    driver: 'pdo_sqlite'
    path: '%kernel.project_dir%/var/discovery/discovering.test.sqlite'
  orm:
    auto_mapping: true
    mappings:
      App:
        is_bundle: false
        type: attribute
        dir: '%kernel.project_dir%/src/Entity'
        prefix: 'App\Discovering\Entity'
      Objecting:
        is_bundle: false
        type: attribute
        dir: '%kernel.project_dir%/vendor/objecting/object/src/Embeddable'
        prefix: 'App\Objecting\Embeddable'
