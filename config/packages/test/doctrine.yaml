parameters:
  app.discovery.default_sqlite_path: '%kernel.project_dir%/var/test/discovering.sqlite'

doctrine:
  dbal:
    connections:
      infra:
        driver: 'pdo_sqlite'
        path: '%kernel.project_dir%/var/test/discovering.sqlite'
  orm:
    auto_mapping: true
    mappings:
      App:
        is_bundle: false
        type: attribute
        dir: '%kernel.project_dir%/src/Entity'
        prefix: 'App\Discovering\Entity'
      Objecting:
        is_bundle: false
        type: attribute
        dir: '%kernel.project_dir%/vendor/objecting/object/src/Embeddable'
        prefix: 'App\Objecting\Embeddable'
